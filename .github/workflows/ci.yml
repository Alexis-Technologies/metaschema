name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # oxlint/oxfmt native bindings need Node >= 20.19, so lint and format run
  # once on Node 22 rather than across the engines matrix.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Smoke: keeps the bundle-size script working, fails if a Node builtin
      # ever reaches the browser bundle, and fails over the min+gzip budgets.
      # 17.75 KB per core entry, 7.5 KB for the ./generators subpath, 4.25 KB
      # for the ./compile subpath, 12 KB for the ./model subpath, 1.5 KB for
      # the ./stream subpath and 2 KB for the ./formats subpath on top of it
      # are the 3.2 budgets (CLAUDE.md "Budgets").
      - run: pnpm size --max-gzip 17.75 --max-gzip-generators 7.5 --max-gzip-compile 4.25 --max-gzip-model 12 --max-gzip-stream 1.5 --max-gzip-formats 2

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:types
      # Compiles index.d.ts on its own — the hand-written type surface has no
      # other compiler pass over it.
      - run: pnpm run check:dts

  # The engines floor is Node 18. `node --test tests/unit/*.test.js` relies on
  # the shell to expand the glob before Node 21, which cmd.exe does not do, so
  # Windows runs only on the Node versions that expand test globs themselves.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22, 24]
        exclude:
          - os: windows-latest
            node-version: 18
          - os: windows-latest
            node-version: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The same suite on the JIT backend (every schema compiled at construction
  # through tests/helpers/jit.js), and once more where code generation from
  # strings is not allowed, so the fallback to the closures is what runs.
  backends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [jit, nojit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:${{ matrix.backend }}

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `shell: bash` runs the step with `-o pipefail`, so the c8 thresholds
      # fail the job through the pipe; the default shell takes tee's status.
      - run: pnpm run test:coverage | tee coverage.txt
        shell: bash
      - name: Coverage summary
        run: |
          { echo '### Coverage'; echo '```'; grep '|' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A broken docs build (including dead links) should fail the PR, not the
      # deploy that follows it.
      - run: pnpm run docs:build

  # Single aggregate check for branch protection: require only "ci-success"
  # instead of naming every matrix leg (which silently un-requires new legs).
  ci-success:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, types, test, backends, coverage, docs]
    if: always()
    steps:
      - name: Fail when any needed job failed, was cancelled or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed"
