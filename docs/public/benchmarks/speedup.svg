<svg xmlns="http://www.w3.org/2000/svg" width="760" height="587" viewBox="0 0 760 587" role="img" aria-label="metaschema 3.3.0 against Metarhia's metaschema 2.2.2. How many times faster, scenario by scenario (1 = as fast). Higher is better.">
<style>
